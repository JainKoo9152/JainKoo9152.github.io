# =========================================================
# Jain Koo - Personal Academic Homepage
# Single-page configuration
# =========================================================

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Jain Koo"
title_separator          : "-"
name                     : &name "Jain Koo"
description              : &description "Jain Koo | Computer Architecture and Efficient ML Systems"

url                      : "https://jainkoo9152.github.io"
baseurl                  : ""
repository               : "JainKoo9152/JainKoo9152.github.io"


# =========================================================
# Author Information
# =========================================================

author:
  avatar           : "JainKoo.jpg"
  name             : "Jain Koo"
  bio              : "M.S. Student at Yonsei University"
  location         : "Seoul, Korea"
  employer         : "Yonsei University"
  email            : "9jtiger@gmail.com"

  # Academic profiles
  googlescholar    : "https://scholar.google.com/citations?user=Tr4jh-4AAAAJ"

  # GitHub
  github           : "JainKoo9152"
  linkedin         : "https://www.linkedin.com/in/jain-koo-785827301/"

  # Leave unused items blank
  academia         :
  arxiv            :
  inspire-hep      :
  impactstory      :
  orcid            :
  semantic         :
  ssrn             :
  pubmed           :
  researchgate     :
  scopus           :
  zotero           :
  twitter          :
  bluesky          :
  youtube          :


# =========================================================
# Site Settings
# =========================================================

breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

comments:
  provider               :

atom_feed:
  hide                   : true

analytics:
  provider               : "false"


# =========================================================
# Files
# =========================================================

include:
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gruntfile.js
  - gulpfile.js
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# =========================================================
# Markdown
# =========================================================

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# =========================================================
# IMPORTANT: Single-page setup
# No publications / talks / teaching / portfolio collections
# =========================================================

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false


# =========================================================
# Sass / CSS
# =========================================================

sass:
  sass_dir: _sass
  style: compressed


# =========================================================
# Output
# =========================================================

permalink: /:categories/:title/
timezone: Asia/Seoul


# =========================================================
# Plugins
# =========================================================

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# =========================================================
# HTML Compression
# =========================================================

compress_html:
  clippings: all
  ignore:
    envs: development
